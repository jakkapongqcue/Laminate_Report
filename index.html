<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HerculesSite — IIS Path Directory</title>
    <meta
      name="description"
      content="IIS HerculesSite virtual path directory listing for hosted web applications."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- icon HerculueSite show Big "H" -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50%25' y='50%25' font-size='80' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3EH%3C/text%3E%3C/svg%3E"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg-deep: #0a0d14;
        --bg-mid: #0e1220;
        --surface: rgba(255, 255, 255, 0.04);
        --surface-hover: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.08);
        --border-accent: rgba(99, 179, 237, 0.4);
        --text-primary: #e8edf5;
        --text-secondary: #8a9ab5;
        --text-muted: #4a5568;
        --accent-blue: #63b3ed;
        --accent-purple: #b794f4;
        --accent-cyan: #76e4f7;
        --accent-green: #68d391;
        --accent-orange: #fbd38d;
        --gradient-start: #667eea;
        --gradient-end: #764ba2;
        --card-glow: rgba(103, 126, 234, 0.12);
        --font-mono: 'JetBrains Mono', monospace;
        --font-sans: 'Inter', sans-serif;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--font-sans);
        /* background-color: var(--bg-deep); */
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 12px;
      }
      .header-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        flex-shrink: 0;
        animation: pulse-glow 3s ease-in-out infinite;
      }
      .header-text h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #0059ff 0%, #b794f4 60%, #667eea 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
      }
      .header-text .subtitle {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .bg-canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .wrapper {
        position: relative;
        z-index: 1;
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }
    </style>
  </head>
  <body>
    <div class="bg-canvas" aria-hidden="true">
      <div class="bg-grid"></div>
      <div class="bg-orb bg-orb-1"></div>
      <div class="bg-orb bg-orb-2"></div>
      <div class="bg-orb bg-orb-3"></div>
    </div>
    <div class="wrapper">
      <div class="header">
        <div class="header-icon" aria-hidden="true">&#x1f576;</div>
        <div class="header-text">
          <h1>HerculesSite</h1>
        </div>
      </div>
    </div>
  </body>
</html>
