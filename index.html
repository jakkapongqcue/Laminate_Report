<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hercules Portal</title>

    <!-- 1. Tailwind CSS CDN (หลัก) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50%25' y='54%25' font-size='60' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3EH%3C/text%3E%3C/svg%3E"
    />

    <!-- 3. Fallback CSS (กรณีใช้งาน Tailwind CDN ไม่ได้ หรือ Offline Intranet) -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Prompt", sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Navbar Fallback */
      .navbar {
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        padding: 14px 24px;
      }
      .navbar-content {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
      }
      .brand-badge {
        width: 40px;
        height: 40px;
        background: #2563eb;
        color: #ffffff;
        font-size: 20px;
        font-weight: 700;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand-title {
        font-size: 1.15rem;
        font-weight: 600;
        color: #0f172a;
      }
      .brand-subtitle {
        font-size: 0.8rem;
        color: #64748b;
      }

      /* Layout Fallback */
      .container {
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        padding: 40px 20px 60px;
        flex: 1;
      }
      .header-area {
        text-align: center;
        margin-bottom: 32px;
      }
      .header-title {
        font-size: 1.8rem;
        font-weight: 600;
        color: #0f172a;
        margin-bottom: 6px;
      }
      .header-desc {
        font-size: 0.95rem;
        color: #64748b;
        margin-bottom: 20px;
      }

      /* Search Box Fallback */
      .search-box {
        position: relative;
        max-width: 420px;
        margin: 0 auto;
      }
      .search-box .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        font-size: 20px;
        pointer-events: none;
      }
      .search-input {
        width: 100%;
        padding: 10px 16px 10px 42px;
        font-size: 0.95rem;
        font-family: inherit;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        outline: none;
      }

      /* Grid & Card Fallback */
      .portal-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .portal-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 18px 20px;
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 16px;
        transition:
          transform 0.15s,
          box-shadow 0.15s,
          border-color 0.15s;
      }
      .portal-card:hover {
        transform: translateY(-2px);
        border-color: #93c5fd;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.08);
      }
      .card-icon {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .card-icon .material-symbols-outlined {
        font-size: 26px;
      }
      .card-content {
        flex: 1;
        min-width: 0;
      }
      .card-title {
        font-size: 1.05rem;
        font-weight: 600;
        color: #0f172a;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-desc {
        font-size: 0.82rem;
        color: #64748b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-arrow {
        color: #cbd5e1;
        display: flex;
        align-items: center;
      }

      /* Footer Fallback */
      .footer {
        background: #ffffff;
        border-top: 1px solid #e2e8f0;
        padding: 16px;
        text-align: center;
        font-size: 0.8rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-['Prompt',sans-serif]"
  >
    <!-- Navbar -->
    <header class="navbar bg-white border-b border-slate-200 px-6 py-3.5">
      <div
        class="navbar-content max-w-6xl mx-auto flex justify-between items-center"
      >
        <a
          href="#"
          class="brand flex items-center gap-3 no-underline text-inherit"
        >
          <div
            class="brand-badge w-10 h-10 bg-blue-600 text-white text-xl font-bold rounded-xl flex items-center justify-center shadow-sm"
          >
            H
          </div>
          <div>
            <div
              class="brand-title text-base font-semibold text-slate-900 leading-tight"
            >
              Hercules Portal
            </div>
            <div class="brand-subtitle text-xs text-slate-500">
              ระบบสารสนเทศภายในองค์กร
            </div>
          </div>
        </a>
      </div>
    </header>

    <!-- Main Container -->
    <main class="container max-w-6xl w-full mx-auto px-5 py-10 flex-1">
      <div class="header-area text-center mb-8">
        <h1 class="header-title text-3xl font-semibold text-slate-900 mb-1.5">
          Web Portal
        </h1>
        <p class="header-desc text-slate-500 text-sm md:text-base mb-5">
          เลือกระบบงานที่ต้องการใช้งาน
        </p>

        <!-- Search Bar -->
        <div class="search-box relative max-w-md mx-auto">
          <span
            class="material-symbols-outlined search-icon absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xl pointer-events-none"
          >
            search
          </span>
          <input
            type="search"
            id="portal-search"
            class="search-input w-full pl-11 pr-4 py-2.5 text-sm bg-white border border-slate-300 rounded-xl outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition-all"
            placeholder="ค้นหาระบบงาน..."
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Card Grid Container (Rendered dynamically from JSON) -->
      <div
        id="portal-grid"
        class="portal-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
      ></div>

      <!-- Empty State -->
      <div
        id="empty-state"
        class="hidden text-center py-12 text-slate-500 text-sm bg-white rounded-xl border border-dashed border-slate-200 mt-4"
      >
        ไม่พบระบบงานที่ค้นหา
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="footer bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400"
    >
      <div>&copy; HerculesSite — Internal Web Portal</div>
    </footer>

    <!-- ========================================================
        CONFIG: จัดการข้อมูล Card ทั้งหมดที่ JSON จุดนี้จุดเดียว
        (สามารถปรับ title, description, url, icon, color ได้ทันที)
        ======================================================== -->
    <script>
      const portalCards = [
        {
          title: "Laminate Report",
          description: "ระบบรายงานการผลิต Laminate",
          url: "http://192.168.3.3:777/LaminateReport",
          icon: "bar_chart",
          color: "#2563eb",
        },
        {
          title: "Machine Dashboard",
          description: "Production and Machine Performance Dashboard",
          url: "http://192.168.3.3:999/pmprd",
          icon: "view_timeline",
          color: "#0d9488",
        },
        {
          title: "Leave Online",
          description: "ระบบยื่นใบลาออนไลน์",
          url: "http://192.168.3.3:999/Leave/",
          icon: "event_available",
          color: "#059669",
        },
        {
          title: "IT Request",
          description: "แจ้งซ่อมและบริการด้าน IT",
          url: "http://192.168.3.3:999/itrequest",
          icon: "support_agent",
          color: "#0284c7",
        },
        {
          title: "Paperless",
          description: "ระบบเอกสารอิเล็กทรอนิกส์",
          url: "http://192.168.3.3:999/Paperless",
          icon: "description",
          color: "#7c3aed",
        },
        {
          title: "จองห้องประชุม",
          description: "ระบบจองห้องประชุม (MTR)",
          url: "http://192.168.3.3:999/MTR",
          icon: "meeting_room",
          color: "#d97706",
        },
        {
          title: "DAR",
          description: "Document Action Request",
          url: "http://192.168.3.3:999/DAR",
          icon: "assignment",
          color: "#0062cc",
        },
        {
          title: "CAR",
          description: "Corrective Action Request",
          url: "http://192.168.3.3:999/CAR",
          icon: "verified_user",
          color: "#e11d48",
        },
        {
          title: "Network",
          description: "ตรวจสอบสถานะเครือข่าย",
          url: "http://192.168.3.3:999/netcheck",
          icon: "lan",
          color: "#008000",
        },
      ];

      // ฟังก์ชัน Render การ์ดลงใน Grid
      const gridContainer = document.getElementById("portal-grid");
      const emptyState = document.getElementById("empty-state");

      function renderCards(cardsToRender) {
        gridContainer.innerHTML = "";

        if (cardsToRender.length === 0) {
          emptyState.classList.remove("hidden");
          emptyState.style.display = "block";
          return;
        }

        emptyState.classList.add("hidden");
        emptyState.style.display = "none";

        cardsToRender.forEach((item) => {
          const card = document.createElement("a");
          card.href = item.url;
          card.target = "_blank";
          card.className =
            "portal-card group flex items-center gap-4 p-4 md:p-5 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 no-underline text-inherit";

          card.innerHTML = `
            <div class="card-icon w-12 h-12 rounded-xl flex items-center justify-center shrink-0 transition-transform group-hover:scale-105"
                  style="background-color: ${item.color}15; color: ${item.color};">
              <span class="material-symbols-outlined text-2xl">${item.icon}</span>
            </div>
            <div class="card-content flex-1 min-w-0">
              <div class="card-title text-base font-semibold text-slate-900 group-hover:text-blue-600 transition-colors truncate">
                ${item.title}
              </div>
              <div class="card-desc text-xs text-slate-500 truncate mt-0.5">
                ${item.description}
              </div>
            </div>
            <div class="card-arrow text-slate-300 group-hover:text-blue-600 group-hover:translate-x-1 transition-all flex items-center shrink-0">
              <span class="material-symbols-outlined text-xl">chevron_right</span>
            </div>
          `;

          gridContainer.appendChild(card);
        });
      }

      // Render ครั้งแรก
      renderCards(portalCards);

      // ระบบค้นหาแบบ Real-time
      const searchInput = document.getElementById("portal-search");
      searchInput.addEventListener("input", (e) => {
        const keyword = e.target.value.trim().toLowerCase();
        const filtered = portalCards.filter((item) => {
          return (
            item.title.toLowerCase().includes(keyword) ||
            item.description.toLowerCase().includes(keyword)
          );
        });
        renderCards(filtered);
      });
    </script>
  </body>
</html>
