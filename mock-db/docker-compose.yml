version: "3.8"

services:
  mock-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_express_mock
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express # กำหนดเป็นรุ่น SQL Server Express
      - MSSQL_SA_PASSWORD=Welcome2026! # รหัสผ่านของ sa (ต้องมีตัวใหญ่, เล็ก, ตัวเลข, สัญลักษณ์)
      - MSSQL_MEMORY_LIMIT_MB=1024 # จำกัด Memory ภายในของ SQL Server ไว้ที่ 1024 MB (1 GB)
    deploy:
      resources:
        limits:
          cpus: "0.75" # จำกัด CPU สูงสุดไม่เกิน 0.75 Core (75% ของ 1 คอร์)
          memory: 1536M # จำกัดเพดาน RAM ของ Container ไม่เกิน 1.5 GB (ขั้นต่ำสุดที่ SQL Server รันได้เสถียร)
    ports:
      - "1433:1433"
    volumes:
      - mssql_mock_data:/var/opt/mssql

volumes:
  mssql_mock_data:
    name: sqlserver_mssql_mock_data
